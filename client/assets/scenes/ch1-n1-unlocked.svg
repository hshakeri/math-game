<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2631" />
      <stop offset="70%" stop-color="#f7f1e3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d8cca8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5dade2" stroke-width="0.5" stroke-opacity="0.2" />
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- Canyon Cliffs -->
  <polygon points="0,600 450,750 350,1080 0,1080" fill="#2c2416" />
  <polygon points="1920,600 1470,750 1570,1080 1920,1080" fill="#2c2416" />
  <polygon points="50,620 420,740 330,1080 50,1080" fill="#d8cca8" opacity="0.3" />
  <polygon points="1870,620 1500,740 1590,1080 1870,1080" fill="#d8cca8" opacity="0.3" />

  <!-- Mist / Abyss -->
  <ellipse cx="960" cy="980" rx="600" ry="80" fill="#5dade2" opacity="0.15" />

  <!-- Bridge Structures -->
  <path d="M 100 800 L 1820 800 L 1820 860 L 100 860 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="4" />

  <!-- Gate 1 (Left) -->
  <g transform="translate(480, 520)">
    <rect x="0" y="0" width="60" height="280" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <rect x="180" y="0" width="60" height="280" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <path d="M 0 0 Q 120 -100 240 0" fill="none" stroke="#2c2416" stroke-width="6" />
    <circle cx="120" cy="-30" r="45" fill="none" stroke="#c8963e" stroke-width="4" stroke-dasharray="6,4" />
    <circle cx="120" cy="-30" r="18" fill="#c8963e" opacity="0.8" />
  </g>

  <!-- Gate 2 (Center) -->
  <g transform="translate(840, 480)">
    <rect x="0" y="0" width="70" height="320" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <rect x="210" y="0" width="70" height="320" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <path d="M 0 0 Q 140 -120 280 0" fill="none" stroke="#2c2416" stroke-width="6" />
    <circle cx="140" cy="-40" r="55" fill="none" stroke="#c8963e" stroke-width="4" stroke-dasharray="8,4" />
    <circle cx="140" cy="-40" r="24" fill="#c8963e" opacity="0.8" />
  </g>

  <!-- Gate 3 (Right) -->
  <g transform="translate(1260, 520)">
    <rect x="0" y="0" width="60" height="280" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <rect x="180" y="0" width="60" height="280" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <path d="M 0 0 Q 120 -100 240 0" fill="none" stroke="#2c2416" stroke-width="6" />
    <circle cx="120" cy="-30" r="45" fill="none" stroke="#c8963e" stroke-width="4" stroke-dasharray="6,4" />
    <circle cx="120" cy="-30" r="18" fill="#c8963e" opacity="0.8" />
  </g>

  <!-- Drafting compass lines -->
  <circle cx="980" cy="440" r="420" fill="none" stroke="#5dade2" stroke-width="1" stroke-dasharray="4,8" opacity="0.4" />
  <line x1="100" y1="800" x2="1820" y2="800" stroke="#5dade2" stroke-width="1" stroke-dasharray="2,6" opacity="0.5" />
</svg>