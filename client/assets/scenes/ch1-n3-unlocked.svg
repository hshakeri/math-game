<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2631" />
      <stop offset="50%" stop-color="#d8cca8" />
      <stop offset="100%" stop-color="#f7f1e3" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wallGrad)" />

  <!-- Castle Perimeter Walls -->
  <rect x="0" y="200" width="1920" height="300" fill="#d8cca8" stroke="#2c2416" stroke-width="4" />
  <!-- Crenellations -->
  <polygon points="200,200 200,140 280,140 280,200 360,200 360,140 440,140 440,200" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
  <polygon points="1480,200 1480,140 1560,140 1560,200 1640,200 1640,140 1720,140 1720,200" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />

  <!-- Keep Gateway in Center Wall -->
  <path d="M 860 500 L 860 320 Q 960 260 1060 320 L 1060 500 Z" fill="#c8963e" stroke="#2c2416" stroke-width="5" />

  <!-- Flagstone Courtyard Floor -->
  <polygon points="0,500 1920,500 1920,1080 0,1080" fill="#f7f1e3" stroke="#2c2416" stroke-width="3" />
  <line x1="0" y1="650" x2="1920" y2="650" stroke="#d8cca8" stroke-width="2" />
  <line x1="0" y1="820" x2="1920" y2="820" stroke="#d8cca8" stroke-width="2" />
  <line x1="0" y1="970" x2="1920" y2="970" stroke="#d8cca8" stroke-width="2" />

  <!-- Five Shields Pavement Setting in Center -->
  <g transform="translate(660, 560)">
    <!-- 3 Upright Shields on Top (width 120, height 200 each) -->
    <!-- Upright Shield 1 -->
    <path d="M 60 40 L 180 40 L 180 180 Q 120 240 60 180 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <circle cx="120" cy="120" r="25" fill="none" stroke="#c8963e" stroke-width="2" />

    <!-- Upright Shield 2 -->
    <path d="M 240 40 L 360 40 L 360 180 Q 300 240 240 180 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <circle cx="300" cy="120" r="25" fill="none" stroke="#c8963e" stroke-width="2" />

    <!-- Upright Shield 3 -->
    <path d="M 420 40 L 540 40 L 540 180 Q 480 240 420 180 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <circle cx="480" cy="120" r="25" fill="none" stroke="#c8963e" stroke-width="2" />

    <!-- 2 Flat Shields Below (width 200, height 120 each) -->
    <!-- Flat Shield 1 -->
    <path d="M 90 270 L 290 270 L 290 350 Q 190 410 90 350 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <circle cx="190" cy="330" r="22" fill="none" stroke="#c8963e" stroke-width="2" />

    <!-- Flat Shield 2 -->
    <path d="M 310 270 L 510 270 L 510 350 Q 410 410 310 350 Z" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <circle cx="410" cy="330" r="22" fill="none" stroke="#c8963e" stroke-width="2" />

    <!-- Seam Grid Lines -->
    <line x1="60" y1="250" x2="540" y2="250" stroke="#c8963e" stroke-width="5" />
    <line x1="300" y1="250" x2="300" y2="400" stroke="#c8963e" stroke-width="5" />
  </g>

  <!-- Architectural Drafting Compass Overlay -->
  <circle cx="960" cy="740" r="340" fill="none" stroke="#5dade2" stroke-width="1" stroke-dasharray="8,6" opacity="0.35" />
</svg>