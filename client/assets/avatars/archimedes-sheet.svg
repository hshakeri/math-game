<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="100%" height="100%">
  <!-- Plain White / Drafting Board Background -->
  <rect width="1024" height="768" fill="#ffffff" />
  <line x1="512" y1="0" x2="512" y2="768" stroke="#d8cca8" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="0" y1="384" x2="1024" y2="384" stroke="#d8cca8" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Quadrant 1: Front View (Top-Left) -->
  <g transform="translate(256, 192)">
    <!-- Owl Body -->
    <ellipse cx="0" cy="20" rx="75" ry="95" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <!-- Feather Belly -->
    <ellipse cx="0" cy="40" rx="45" ry="60" fill="#d8cca8" opacity="0.5" />
    <!-- Wings Folded -->
    <path d="M -75 0 Q -95 60 -50 90" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <path d="M 75 0 Q 95 60 50 90" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
    <!-- Owl Head -->
    <circle cx="0" cy="-60" r="60" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <!-- Ear Tufts -->
    <polygon points="-40,-100 -20,-70 -50,-60" fill="#2c2416" />
    <polygon points="40,-100 20,-70 50,-60" fill="#2c2416" />
    <!-- Eyes & Brass Spectacles -->
    <circle cx="-24" cy="-55" r="22" fill="#ffffff" stroke="#c8963e" stroke-width="4" />
    <circle cx="24" cy="-55" r="22" fill="#ffffff" stroke="#c8963e" stroke-width="4" />
    <line x1="-2" y1="-55" x2="2" y2="-55" stroke="#c8963e" stroke-width="4" />
    <circle cx="-24" cy="-55" r="8" fill="#1c2631" />
    <circle cx="24" cy="-55" r="8" fill="#1c2631" />
    <!-- Beak -->
    <polygon points="0,-42 -8,-25 8,-25" fill="#c8963e" stroke="#2c2416" stroke-width="2" />
    <!-- Perch Feet -->
    <rect x="-35" y="110" width="25" height="12" rx="4" fill="#c8963e" stroke="#2c2416" stroke-width="2" />
    <rect x="10" y="110" width="25" height="12" rx="4" fill="#c8963e" stroke="#2c2416" stroke-width="2" />
  </g>

  <!-- Quadrant 2: Back View (Top-Right) -->
  <g transform="translate(768, 192)">
    <ellipse cx="0" cy="20" rx="75" ry="95" fill="#d8cca8" stroke="#2c2416" stroke-width="4" />
    <circle cx="0" cy="-60" r="60" fill="#d8cca8" stroke="#2c2416" stroke-width="4" />
    <polygon points="-40,-100 -20,-70 -50,-60" fill="#2c2416" />
    <polygon points="40,-100 20,-70 50,-60" fill="#2c2416" />
    <!-- Spectacle Strap -->
    <path d="M -50 -55 Q 0 -45 50 -55" fill="none" stroke="#c8963e" stroke-width="3" />
    <!-- Tail Feathers -->
    <polygon points="0,110 -25,135 25,135" fill="#2c2416" />
  </g>

  <!-- Quadrant 3: Left Profile (Bottom-Left) -->
  <g transform="translate(256, 576)">
    <ellipse cx="-10" cy="20" rx="65" ry="95" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <circle cx="-10" cy="-60" r="55" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <polygon points="-30,-100 -15,-70 -40,-60" fill="#2c2416" />
    <!-- Left Eye & Monocle / Spectacle side -->
    <circle cx="-35" cy="-55" r="20" fill="#ffffff" stroke="#c8963e" stroke-width="4" />
    <circle cx="-35" cy="-55" r="7" fill="#1c2631" />
    <polygon points="-58,-48 -70,-40 -58,-35" fill="#c8963e" stroke="#2c2416" stroke-width="2" />
    <path d="M 0 10 Q 55 50 10 90" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
  </g>

  <!-- Quadrant 4: Right Profile (Bottom-Right) -->
  <g transform="translate(768, 576)">
    <ellipse cx="10" cy="20" rx="65" ry="95" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <circle cx="10" cy="-60" r="55" fill="#f7f1e3" stroke="#2c2416" stroke-width="4" />
    <polygon points="30,-100 15,-70 40,-60" fill="#2c2416" />
    <circle cx="35" cy="-55" r="20" fill="#ffffff" stroke="#c8963e" stroke-width="4" />
    <circle cx="35" cy="-55" r="7" fill="#1c2631" />
    <polygon points="58,-48 70,-40 58,-35" fill="#c8963e" stroke="#2c2416" stroke-width="2" />
    <path d="M 0 10 Q -55 50 -10 90" fill="#d8cca8" stroke="#2c2416" stroke-width="3" />
  </g>
</svg>